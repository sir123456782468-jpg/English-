<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول | Mr. Sherif Khafagy Academy</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' }</script>
  <link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Readex Pro', sans-serif; background-color: #090d16; color: #f1f5f9; }
    .card-style { background: linear-gradient(180deg, #121824 0%, #0d121c 100%); border: 1px solid rgba(255, 255, 255, 0.07); }
    .inner-box { background-color: #080c14; border-color: #1e293b; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-md card-style p-8 rounded-3xl space-y-6 shadow-2xl">
    <div class="text-center space-y-2">
      <h1 class="text-2xl font-bold text-white">مستر شريف خفاجي</h1>
      <p class="text-xs text-emerald-500 font-medium">أكاديمية اللغة الإنجليزية</p>
    </div>

    <!-- أزرار التنقل -->
    <div class="flex rounded-xl bg-slate-900 p-1 border border-slate-800">
      <button type="button" onclick="toggleForm('login')" id="tabLogin" class="w-1/2 py-2 text-xs font-bold rounded-lg bg-emerald-500 text-slate-950 transition">تسجيل دخول</button>
      <button type="button" onclick="toggleForm('register')" id="tabRegister" class="w-1/2 py-2 text-xs font-bold rounded-lg text-slate-400 hover:text-white transition">طالب جديد</button>
    </div>

    <!-- نموذج تسجيل الدخول -->
    <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
      <div>
        <label class="text-xs font-semibold text-slate-400 block mb-1.5">رقم الهاتف</label>
        <input type="tel" id="loginPhone" required placeholder="01xxxxxxxxx" autocomplete="username" class="w-full px-4 py-3 rounded-xl inner-box border border-slate-800 text-xs text-white focus:outline-none focus:border-emerald-500">
      </div>
      <div>
        <label class="text-xs font-semibold text-slate-400 block mb-1.5">كلمة السر</label>
        <div class="relative">
          <input type="password" id="loginPassword" required placeholder="••••••••" autocomplete="current-password" class="w-full px-4 py-3 rounded-xl inner-box border border-slate-800 text-xs text-white focus:outline-none focus:border-emerald-500 pl-10">
          <button type="button" onclick="togglePasswordVisibility('loginPassword')" class="absolute left-3 top-2.5 text-slate-400 text-xs">👁️</button>
        </div>
      </div>
      <button type="submit" class="w-full py-3.5 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold rounded-xl text-xs transition shadow-lg shadow-emerald-500/10">دخول المنصة 🚀</button>
    </form>

    <!-- نموذج طالب جديد -->
    <form id="registerForm" onsubmit="handleRegister(event)" class="space-y-4 hidden">
      <div>
        <label class="text-xs font-semibold text-slate-400 block mb-1.5">الاسم ثلاثي</label>
        <input type="text" id="regName" required placeholder="أحمد محمد علي" class="w-full px-4 py-3 rounded-xl inner-box border border-slate-800 text-xs text-white focus:outline-none focus:border-emerald-500">
      </div>
      <div>
        <label class="text-xs font-semibold text-slate-400 block mb-1.5">الصف الدراسي</label>
        <select id="regGrade" required class="w-full px-4 py-3 rounded-xl inner-box border border-slate-800 text-xs text-white focus:outline-none focus:border-emerald-500">
          <option value="الصف الأول الثانوي">الصف الأول الثانوي</option>
          <option value="الصف الثاني الثانوي">الصف الثاني الثانوي</option>
          <option value="الصف الثالث الثانوي">الصف الثالث الثانوي</option>
        </select>
      </div>
      <div>
        <label class="text-xs font-semibold text-slate-400 block mb-1.5">رقم هاتف الطالب</label>
        <input type="tel" id="regPhone" required placeholder="01xxxxxxxxx" class="w-full px-4 py-3 rounded-xl inner-box border border-slate-800 text-xs text-white focus:outline-none focus:border-emerald-500">
      </div>
      <div>
        <label class="text-xs font-semibold text-slate-400 block mb-1.5">رقم ولي الأمر</label>
        <input type="tel" id="regParentPhone" required placeholder="01xxxxxxxxx" class="w-full px-4 py-3 rounded-xl inner-box border border-slate-800 text-xs text-white focus:outline-none focus:border-emerald-500">
      </div>
      <div>
        <label class="text-xs font-semibold text-slate-400 block mb-1.5">كلمة السر</label>
        <input type="password" id="regPassword" required placeholder="••••••••" class="w-full px-4 py-3 rounded-xl inner-box border border-slate-800 text-xs text-white focus:outline-none focus:border-emerald-500">
      </div>
      <button type="submit" class="w-full py-3.5 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold rounded-xl text-xs transition shadow-lg shadow-emerald-500/10">إرسال طلب الانضمام 📩</button>
    </form>

  </div>

  <script>
    const ADMIN_PHONE = "01113075084";
    const ADMIN_PASSWORD = "123456789"; // تم التغيير لـ 123456789

    function togglePasswordVisibility(inputId) {
      const input = document.getElementById(inputId);
      input.type = input.type === 'password' ? 'text' : 'password';
    }

    function toggleForm(type) {
      if(type === 'login') {
        document.getElementById('loginForm').classList.remove('hidden');
        document.getElementById('registerForm').classList.add('hidden');
        document.getElementById('tabLogin').className = "w-1/2 py-2 text-xs font-bold rounded-lg bg-emerald-500 text-slate-950 transition";
        document.getElementById('tabRegister').className = "w-1/2 py-2 text-xs font-bold rounded-lg text-slate-400 hover:text-white transition";
      } else {
        document.getElementById('loginForm').classList.add('hidden');
        document.getElementById('registerForm').classList.remove('hidden');
        document.getElementById('tabRegister').className = "w-1/2 py-2 text-xs font-bold rounded-lg bg-emerald-500 text-slate-950 transition";
        document.getElementById('tabLogin').className = "w-1/2 py-2 text-xs font-bold rounded-lg text-slate-400 hover:text-white transition";
      }
    }

    function handleLogin(e) {
      e.preventDefault();
      const phone = document.getElementById('loginPhone').value.trim();
      const pass = document.getElementById('loginPassword').value.trim();

      // دخول الأدمن
      if (phone === ADMIN_PHONE && pass === ADMIN_PASSWORD) {
        localStorage.setItem('sherif_academy_role', 'admin');
        window.location.href = 'admin-dashboard.html';
        return;
      }

      // دخول الطالب
      const students = JSON.parse(localStorage.getItem('registered_students') || '[]');
      const student = students.find(s => s.phone === phone && s.password === pass);

      if (!student) {
        alert('رقم الهاتف أو كلمة السر غير صحيحة!');
        return;
      }

      if (student.status === 'pending') {
        alert('⏳ حسابك قيد المراجعة! يرجى الانتظار حتى يوافق مستر شريف خفاجي على طلب انضمامك.');
        return;
      }

      if (student.status === 'rejected' || student.status === 'banned') {
        alert('⛔ تم رفض حسابك أو حظرك من المنصة.');
        return;
      }

      localStorage.setItem('sherif_academy_role', 'student');
      localStorage.setItem('sherif_academy_user', JSON.stringify(student));
      window.location.href = 'student-dashboard.html';
    }

    function handleRegister(e) {
      e.preventDefault();
      const name = document.getElementById('regName').value.trim();
      const grade = document.getElementById('regGrade').value;
      const phone = document.getElementById('regPhone').value.trim();
      const parentPhone = document.getElementById('regParentPhone').value.trim();
      const password = document.getElementById('regPassword').value.trim();

      let students = JSON.parse(localStorage.getItem('registered_students') || '[]');

      if (students.some(s => s.phone === phone)) {
        alert('هذا الرقم مسجل بالفعل!');
        return;
      }

      const newStudent = { name, grade, phone, parentPhone, password, status: 'pending' };
      students.push(newStudent);
      localStorage.setItem('registered_students', JSON.stringify(students));

      alert('✅ تم إرسال طلب الانضمام بنجاح! سيتم تفعيل حسابك فور موافقة المستر.');
      toggleForm('login');
      document.getElementById('registerForm').reset();
    }
  </script>
</body>
</html>
